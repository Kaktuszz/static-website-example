<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="images/logo.svg" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <title>PC2 | Repair form</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" id="nav">
      <div class="container-fluid" id="navbarr">
        <a class="navbar-brand" href="index.html"
          ><img src="images/logo2.svg" alt="Logo PC2" class="log"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="rep.html"
                >Repair form</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About us</a>
            </li>
            <li>
              <a class="nav-link" href="reviews.html">Reviews</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container">
      <div id="forma">
        <form action="thank.html">
          <div class="my-5">
            <h2>Please fill out the form</h2>
            <select
              class="form-select mb-3"
              aria-label="Which device you want to repair?"
              id="selektor"
            >
              <option selected>Which device you want to repair?</option>
              <option value="1">Laptop</option>
              <option value="2">Phone</option>
              <option value="3">Tablet</option>
            </select>
            <p>Do you have software or hardware problem?</p>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="problem"
                id="problem1"
              />
              <label class="form-check-label" for="problem1"> Software </label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="problem"
                id="problem2"
              />
              <label class="form-check-label" for="problem2"> Hardware </label>
            </div>
            <div class="form-check mb-3">
              <input
                class="form-check-input"
                type="radio"
                name="problem"
                id="problem3"
              />
              <label class="form-check-label" for="problem3">
                I don't know
              </label>
            </div>
            <textarea
              class="form-control"
              placeholder="Leave a description of your problem here"
              id="textareas"
            ></textarea>
            <div id="numba" class="my-4">
              <label for="problem4">Please enter your phone number:</label
              ><br />
              <input
                type="tel"
                name="number"
                id="problem4"
                required
                pattern="[0-9]{3}[0-9]{3}[0-9]{3}"
                placeholder="096-212-134"
              />
            </div>
            <div id="mail" class="my-4">
              <label for="problem5">Please enter your E-mail:</label><br />
              <input
                type="email"
                name="email"
                id="problem5"
                required
                placeholder="example@gmail.com"
              />
            </div>
            <div class="form-check form-switch my-2">
              <input
                class="form-check-input"
                type="checkbox"
                role="switch"
                id="prom"
              />
              <label class="form-check-label" for="prom"
                >Do you want to recieve our promotional emails?</label
              >
            </div>
            <div class="form-check form-switch">
              <input
                class="form-check-input"
                type="checkbox"
                role="switch"
                id="priv"
                required
              />
              <label class="form-check-label" for="priv"
                >Do you agree with our privacy policy?</label
              >
            </div>
            <input class="sub my-2" type="submit" value="Submit" />
          </div>
        </form>
      </div>
    </div>
    <footer class="navbar navbar-expand-lg fixed-bottom" id="botm">
      <div class="container-fluid">
        <h6>Author: Bohdan Fedirko</h6>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://code.jquery.com/jquery-3.6.3.js"
      integrity="sha256-nQLuAZGRRcILA+6dMBOvcRh5Pe310sBpanc6+QBmyVM="
      crossorigin="anonymous"
    ></script>
    <script src="scripts.js"></script>
  </body>
</html>
